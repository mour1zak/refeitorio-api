services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refeitorio
    ports:
      - '5432:5432'
    volumes:
      - refeitorio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d refeitorio']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  refeitorio_pgdata:
